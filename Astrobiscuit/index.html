<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Names List</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: min(600px, 90vw);
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
      text-align: center;
      letter-spacing: 1px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 20px 0 0;
    }

    li {
      padding: 10px 12px;
      margin: 8px 0;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      transition: transform 0.15s ease, background 0.15s ease;
      word-break: break-word;
    }

    li:hover {
      transform: translateX(6px);
      background: rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <div class="container">
    <ul>
      <li>Gonnastickmyheadinacamera</li>
      <li>Sword of the Six Adams 💫 [NEB㏗]</li>
      <li>greatest best person ever [OA]</li>
      <li>emily</li>
      <li>RyanFav</li>
      <li>Paint the Enlightened</li>
      <li>yes focusing(finally collimated)</li>
      <li>pirosow</li>
    </ul>
  </div>
</body>
</html>
